<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Master of Orion — Reborn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060919">
<!-- Optional web fonts: the game falls back to system fonts when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Marcellus&family=Marcellus+SC&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <div id="screens"></div>
  <div id="overlay"></div>
  <div id="toasts"></div>
  <div id="tip" role="tooltip"></div>

    <div class="boot-sub">Charting the galaxy…</div>
