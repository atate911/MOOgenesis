<!doctype html>
<html lang="en" data-theme="v2">
<head>
<meta charset="utf-8">
<title>Master of Orion — Reborn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060919">
<!-- Optional web fonts: the game falls back to system fonts when offline. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27%23d6b36a%27/%3E%3C/svg%3E">
<script>
// Theme v2 ("serious sci-fi") is the default; ?theme=v1 restores the original look. ?accent=cyan|amber|leaf, ?fx=off drop the vignette/scanlines.
(function () { try { var q = new URLSearchParams(location.search), r = document.documentElement, t = q.get('theme');
  if (t === 'v1') r.removeAttribute('data-theme'); if (q.get('accent')) r.setAttribute('data-accent', q.get('accent')); if (q.get('fx')) r.setAttribute('data-fx', q.get('fx')); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Oxanium:wght@400;500;600&family=Marcellus&family=Marcellus+SC&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <div id="screens"></div>
  <div id="overlay"></div>
  <div id="toasts"></div>
  <div id="tip" role="tooltip"></div>
  <div id="boot">
    <div class="boot-mark">Master of Orion</div>
    <div class="boot-sub">Charting the galaxy…</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <pre id="boot-err"></pre>
  </div>
</div>
<script src="js/manifest.js"></script>
<script src="js/loader.js"></script>
</body>
</html>
