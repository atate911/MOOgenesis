<!-- Optional web fonts: the game falls back to system fonts when offline. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27%23d6b36a%27/%3E%3C/svg%3E">
<script>
// Theme v2 ("serious sci-fi") is the default; ?theme=v1 restores the original look. ?accent=cyan|amber|leaf, ?fx=off drop the vignette/scanlines.
(function () { try { var q = new URLSearchParams(location.search), r = document.documentElement, t = q.get('theme');
  if (t === 'v1') r.removeAttribute('data-theme'); if (q.get('accent')) r.setAttribute('data-accent', q.get('accent')); if (q.get('fx')) r.setAttribute('data-fx', q.get('fx')); } catch (e) {} })();
// Phone layout layer (css/phone.css, js/ui/phone.js): decided here, before any stylesheet loads. ?phone=1|0 forces it for this page load;
// else the Options › Display setting "Phone layout" (on / off, kept in localStorage under moo.settings.v1 as phoneMode) pins it; else auto: a
// coarse-pointer device whose shorter screen side is 600px or less (phones in either orientation; tablets keep the desktop layout).
(function () { try { var q = new URLSearchParams(location.search), f = q.get('phone'), on, pinned = f === '1' || f === '0';
  if (!pinned) { try { var st = JSON.parse(localStorage.getItem('moo.settings.v1') || '{}'); if (st.phoneMode === 'on' || st.phoneMode === 'off') { f = st.phoneMode === 'on' ? '1' : '0'; pinned = true; } } catch (e2) {} }
  if (pinned) on = f === '1'; else on = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches) && Math.min(screen.width, screen.height) <= 600;
  window.MOO_PHONE = on; window.MOO_PHONE_FORCED = pinned; if (on) document.documentElement.setAttribute('data-phone', ''); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

  </div>
</div>

</body>
