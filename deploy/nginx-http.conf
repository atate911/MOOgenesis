# Bootstrap vhost (HTTP only) — used by install.sh until a TLS certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name moo.dhlab.us;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        root /srv/moo/current;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
