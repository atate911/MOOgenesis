# Master of Orion — Reborn: nginx vhost for moo.dhlab.us
# Installed to /etc/nginx/sites-available/moo.dhlab.us by deploy/install.sh.
# The game is 100% static (no backend): saves live in each player's browser (localStorage).

server {
    listen 80;
    listen [::]:80;
    server_name moo.dhlab.us;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moo.dhlab.us;

    ssl_certificate     /etc/letsencrypt/live/moo.dhlab.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moo.dhlab.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MOO_SSL:10m;
    ssl_session_tickets off;

    root /srv/moo/current;          # symlink switched atomically by deploy.sh
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/moo.access.log;
    error_log  /var/log/nginx/moo.error.log;

    # ---- security headers ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Workers are spawned from blob: URLs; Google Fonts are optional (the game falls back to system fonts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # ---- compression ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- caching ----
    # Assets are requested as file.js?_=<build id>; every deploy stamps a new id, so they can be cached hard.
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?|mp3|ogg|wav)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header in a location drops the server-level ones, so repeat them:
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The entry page must always be revalidated so players pick up new builds.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / { try_files $uri $uri/ =404; }

    # Never serve dotfiles (except ACME, handled on :80).
    location ~ /\.(?!well-known) { deny all; }
}
