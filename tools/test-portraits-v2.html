<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portraits v2 - converted races</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #05070a; color: #9aa6b2; font: 12px/1.4 monospace; }
  #bar { padding: 6px 10px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  #bar a { color: #8fb2d6; }
  #grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 20px; align-items: flex-start; }
  .c { text-align: center; }
  canvas { display: block; box-shadow: 0 0 0 1px #1c242c; }
  #err { color: #ff9a9a; white-space: pre-wrap; padding: 0 10px; }
</style>
</head>
<body>
<div id="bar"></div>
<pre id="err"></pre>
<div id="grid"></div>
<script src="../js/core/ns.js"></script>
<script>document.write('<script src="../js/gfx/portraits.js?v=' + Date.now() + '"><\/script>');</script>
<script>
/* Dev page for the v2 (physical) portrait renderer.   ?races=human,mrrshan&size=320&mood=neutral&variants=0,1,2,3&talk=0&bg=1&t=2&anim=0&moods=1&small=1
   moods=1 : one row per race with every mood.   small=1 : adds 120/64 px strips and r=40/26/16 badges.   anim=1 : animate (60 fps) */
(function () {
  'use strict';
  const q = new URLSearchParams(location.search), P = MOO.Gfx.Portraits, $ = (id) => document.getElementById(id);
  const err = (m) => { $('err').textContent += m + '\n'; };
  window.addEventListener('error', (e) => err('ERROR ' + e.message + ' @' + e.lineno));
  const conv = P.converted(), races = (q.get('races') || conv.join(',')).split(',').filter(Boolean);
  const size = +(q.get('size') || 320), mood = q.get('mood') || 'neutral', t0 = +(q.get('t') || 2), anim = q.get('anim') === '1';
  const variants = (q.get('variants') || '0').split(',').map(Number), talk = q.get('talk') === '1', bg = q.get('bg') === '0' ? false : true;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  $('bar').innerHTML = 'v2 races: ' + conv.join(', ') + ' &nbsp; <a href="?moods=1&size=200">moods</a> <a href="?variants=0,1,2,3,4,5,6,7&size=200">variants</a> <a href="?small=1">small sizes</a> <a href="?anim=1&size=420&races=human">animated</a>';
  const cells = [];
  function cell(label, w, h, fn, parent) {
    const d = document.createElement('div'); d.className = 'c';
    const c = document.createElement('canvas'); c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.width = w + 'px'; c.style.height = h + 'px';
    d.appendChild(c); if (label) { const l = document.createElement('div'); l.textContent = label; d.appendChild(l); }
    (parent || $('grid')).appendChild(d);
    const g = c.getContext('2d'); cells.push({ g: g, w: w, h: h, fn: fn });
    return g;
  }
  function paint(cl, t) { cl.g.setTransform(dpr, 0, 0, dpr, 0, 0); cl.g.clearRect(0, 0, cl.w, cl.h); cl.fn(cl.g, cl.w, cl.h, t); }
  const h = (w) => Math.round(w * 1.25);
  if (q.get('moods') === '1') {
    races.forEach((r) => P.MOODS.forEach((m) => cell(r + ' ' + m, size, h(size), (g, w, hh, t) => P.draw(g, r, 0, 0, w, hh, { t: t, mood: m, variant: variants[0], color: '#b83a3a', bg: bg, talking: talk }))));
  } else if (q.get('small') === '1') {
    races.forEach((r) => {
      [160, 96, 64].forEach((s) => cell(r + ' ' + s, s, h(s), (g, w, hh, t) => P.draw(g, r, 0, 0, w, hh, { t: t, mood: mood, color: '#b83a3a' })));
      [40, 26, 16].forEach((rad) => cell('badge ' + rad, rad * 2 + 6, rad * 2 + 6, (g, w, hh, t) => P.drawBadge(g, r, w / 2, hh / 2, rad, { t: t, mood: mood, color: '#b83a3a' })));
    });
  } else {
    races.forEach((r) => variants.forEach((v) => cell(r + (variants.length > 1 ? ' v' + v : ''), size, h(size), (g, w, hh, t) => P.draw(g, r, 0, 0, w, hh, { t: t, mood: mood, variant: v, color: '#b83a3a', bg: bg, talking: talk }))));
  }
  const tb = performance.now();
  cells.forEach((cl) => paint(cl, t0));
  $('bar').innerHTML += ' &nbsp; first paint ' + (performance.now() - tb).toFixed(0) + ' ms (' + cells.length + ' canvases, includes bakes)';
  if (anim) (function loop(now) { const t = now / 1000; cells.forEach((cl) => paint(cl, t)); requestAnimationFrame(loop); })(performance.now());
})();
</script>
</body>
</html>
