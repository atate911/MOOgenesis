<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon set · test page</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/kit.css">
<style>
  html, body { height: auto; min-height: 100%; overflow: auto; }
  body { background: radial-gradient(ellipse at 25% -5%, #141e55 0%, var(--void) 62%) fixed; user-select: text; -webkit-user-select: text; }
  .pg { max-width: 1560px; margin: 0 auto; padding: .6rem 1.2rem 3rem; }
  .top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem .9rem; padding: .55rem 0 .7rem; background: linear-gradient(180deg, var(--void) 78%, rgba(6, 9, 25, 0)); }
  .top h1 { font-size: 1.5rem; margin-right: .6rem; }
  .top .field { min-width: 14rem; }
  .seg { display: inline-flex; gap: .25rem; align-items: center; }
  .seg > span { color: var(--mist); font-size: .85rem; margin-right: .2rem; }
  .status { margin: 0 0 .6rem; padding: .35rem .7rem; font-size: .9rem; border-left: 3px solid var(--leaf); background: rgba(95, 220, 143, .08); color: var(--leaf); }
  .status.bad { border-color: var(--rose); background: rgba(255, 92, 106, .1); color: var(--rose); }
  .status ul { margin: .3rem 0 0 1.1rem; padding: 0; color: var(--ivory); }
  .ctx { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem 1.1rem; margin-bottom: .9rem; font-size: 1rem; }
  .ctx .btn { font-size: .95rem; }
  h2.grp { margin: 1.1rem 0 .45rem; font-size: 1.05rem; color: var(--brass); letter-spacing: .06em; border-bottom: 1px solid rgba(214, 179, 106, .25); padding-bottom: .25rem; }
  h2.grp small { color: var(--fog); font: 400 .8rem var(--font-ui); letter-spacing: 0; margin-left: .5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw, 150px), 1fr)); gap: .5rem; }
  .card { padding: .5rem .55rem .4rem; }
  .card .sz { display: flex; align-items: flex-end; justify-content: center; gap: .75rem; min-height: var(--rowh, 48px); }
  .card .nm { margin-top: .4rem; text-align: center; font-size: .82rem; color: var(--ivory); letter-spacing: .02em; }
  .card .nm i { display: block; font-style: normal; font-size: .68rem; color: var(--fog); font-variant-numeric: tabular-nums; }
  .card .nm i.warn { color: var(--ember); }
  .card .z { position: relative; line-height: 0; }
  .card .z.g::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to right, rgba(98, 216, 255, .22) 1px, transparent 1px), linear-gradient(to bottom, rgba(98, 216, 255, .22) 1px, transparent 1px);
    background-size: calc(100% / 24) calc(100% / 24); box-shadow: inset 0 0 0 1px rgba(98, 216, 255, .35); }
  .card.hit { box-shadow: 0 0 0 2px var(--cyan); }
  .s16 { color: var(--ivory); } .s24 { color: var(--brass); } .sbig { color: var(--cyan); }
  .px svg { display: inline-block; vertical-align: top; }
  .none { color: var(--mist); padding: 1rem 0; }
  .pix { flex: none; }
  body.sheetmode .card { padding: .3rem .25rem .25rem; }
  body.sheetmode .card .nm { margin-top: .2rem; font-size: .72rem; }
  body.sheetmode .card .nm i { display: none; }
  body.sheetmode .grid { gap: .3rem; }
  body.sheetmode h2.grp { margin: .6rem 0 .3rem; }
  body.sheetmode .ctx, body.sheetmode .status { display: none; }
</style>
</head>
<body>
<div class="pg">
  <div class="top">
    <h1>Icon set</h1>
    <input id="q" class="field" type="search" placeholder="Search icons…" autocomplete="off" spellcheck="false">
    <span class="seg" id="zoomSeg"><span>Large size</span></span>
    <span class="seg"><label class="check"><input type="checkbox" id="gridChk"> 24-grid overlay</label></span>
    <span class="seg"><label class="check"><input type="checkbox" id="inkChk" checked> ink %</label></span>
    <span class="seg"><label class="check" title="rasterise 16/24 px at 1x and magnify without smoothing"><input type="checkbox" id="pixChk"> pixel view</label></span>
    <span class="seg"><label class="check" title="large icons only, tightly packed"><input type="checkbox" id="sheetChk"> sheet</label></span>
    <span class="small t-mist" id="count"></span>
  </div>
  <div id="status" class="status">Running self-test…</div>
  <div class="ctx" id="ctx"></div>
  <div id="groups"></div>
</div>

<script src="../js/core/ns.js"></script>
<script src="../js/gfx/icons.js"></script>
<script>
(function () {
  'use strict';
  const Icons = window.MOO && window.MOO.Gfx && window.MOO.Gfx.Icons;
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  if (!Icons) { $('status').className = 'status bad'; $('status').textContent = 'MOO.Gfx.Icons is missing — js/gfx/icons.js failed to load.'; return; }

  // ---- the contract: every name the brief requires -------------------------------------------------
  const GROUPS = [
    ['Ships & fleets', 'ship fleet scout colonyship transport warship starbase stargate'],
    ['Worlds & space', 'colony home planet star galaxy orbit moon asteroid gasgiant'],
    ['Economy', 'pop food industry research money defense ecology waste terraform minerals fuel trade tribute'],
    ['Research fields', 'computers construction forcefield planetology propulsion weapons'],
    ['Ship components', 'beam missile bomb armor shield engine ecm special speed range cloak repair'],
    ['War & intrigue', 'troops spy war target skull rebel plague pirate monster antaran orion artifact nova'],
    ['Diplomacy & politics', 'diplomacy peace alliance treaty council vote news score crown'],
    ['Events & knowledge', 'tech discover event warning info eye search'],
    ['Interface', 'ok cancel add remove up down left right expand collapse lock unlock settings save load sound music mute play pause nextturn design map list'],
  ].map(g => [g[0], g[1].split(' ')]);
  const REQUIRED = [].concat.apply([], GROUPS.map(g => g[1]));

  // ---- self-test ------------------------------------------------------------------------------------
  const problems = [];
  const names = Icons.names();
  const missing = REQUIRED.filter(n => !Icons.has(n));
  if (missing.length) problems.push('missing ' + missing.length + ' required icons: ' + missing.join(', '));
  const dup = names.filter((n, i) => names.indexOf(n) !== i);
  dup.forEach(n => problems.push('duplicate name: ' + n));
  const parser = new DOMParser();
  names.forEach(n => {
    const s = Icons.svg(n);
    if (!/^<svg viewBox="0 0 24 24" xmlns="http:\/\/www\.w3\.org\/2000\/svg"/.test(s)) problems.push(n + ': svg() must start with the documented <svg viewBox xmlns> opening');
    if (/NaN|undefined|Infinity/.test(s)) problems.push(n + ': bad number in markup');
    if (/#[0-9a-f]{3,8}\b|rgb\(|hsl\(/i.test(s)) problems.push(n + ': hard-coded colour (must use currentColor)');
    const doc = parser.parseFromString(s, 'image/svg+xml');
    if (doc.querySelector('parsererror')) { problems.push(n + ': XML parse error'); return; }
    doc.querySelectorAll('*').forEach(e => {
      if (e.localName === 'path' && !/^\s*[Mm](?:[MmLlHhVvCcSsQqTtAaZz]|[-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?|[\s,])*$/.test(e.getAttribute('d') || '')) problems.push(n + ': <path> with invalid d="' + String(e.getAttribute('d')).slice(0, 30) + '…"');
      const st = e.getAttribute('stroke');
      if (st && st !== 'none' && (e.getAttribute('fill') !== 'none' || !e.getAttribute('stroke-width'))) problems.push(n + ': <' + e.localName + '> has stroke but not fill="none" + explicit stroke-width');
      if (st && st !== 'none' && st !== 'currentColor') problems.push(n + ': stroke must be currentColor');
      const fl = e.getAttribute('fill'); if (fl && fl !== 'none' && fl !== 'currentColor') problems.push(n + ': fill must be currentColor/none');
    });
  });
  const o = Icons.svg('ship', { size: 20, cls: 'a b', title: 'Tom & "Jerry" <x>' });
  const od = parser.parseFromString(o, 'image/svg+xml');
  if (od.querySelector('parsererror')) problems.push('svg(): options (size/cls/title) produce invalid XML');
  else {
    const r = od.documentElement;
    if (r.getAttribute('width') !== '20' || r.getAttribute('height') !== '20') problems.push('svg(): size option not applied');
    if (r.getAttribute('class') !== 'a b') problems.push('svg(): cls option not applied');
    if (!od.querySelector('title') || od.querySelector('title').textContent !== 'Tom & "Jerry" <x>') problems.push('svg(): title option not applied/escaped');
  }
  if (Icons.has('definitely-not-an-icon')) problems.push('has() true for unknown name');
  if (typeof Icons.svg('definitely-not-an-icon') !== 'string') problems.push('svg() must return a string for unknown names');
  if (!Icons.defs || typeof Icons.defs.ship !== 'string') problems.push('defs map missing');

  // every <path> must be geometry the browser could actually parse (an invalid d="" renders nothing and only logs a console error)
  (function () {
    const host = document.createElement('div'); host.style.cssText = 'position:absolute;left:-9999px;top:0;width:24px;height:24px;overflow:hidden';
    document.body.appendChild(host);
    names.forEach(n => {
      host.innerHTML = Icons.svg(n, { size: 24 });
      host.querySelectorAll('path').forEach(p => { if (!(p.getTotalLength() > 0)) problems.push(n + ': a <path> has no drawable geometry (invalid path data?)'); });
    });
    host.remove();
  })();

  // ---- render --------------------------------------------------------------------------------------
  let zoom = parseInt(qs.get('zoom') || '48', 10) || 48;
  const cards = {};
  function sizeCell(name, px, cls) {
    const s = document.createElement('span');
    s.className = 'px ' + cls; s.style.width = px + 'px'; s.style.height = px + 'px';
    s.innerHTML = Icons.svg(name, { size: px });
    return s;
  }
  // 1x raster of the icon (what a non-hi-dpi screen shows), magnified with no smoothing so pixel-level problems are visible
  function pixCell(name, px, scale, cls, colour) {
    const cv = document.createElement('canvas'); cv.width = cv.height = px; cv.className = 'pix ' + cls;
    cv.style.width = cv.style.height = (px * scale) + 'px'; cv.style.imageRendering = 'pixelated';
    const img = new Image();
    img.onload = () => cv.getContext('2d').drawImage(img, 0, 0, px, px);
    img.src = Icons.dataUrl(name, colour);
    return cv;
  }
  function build() {
    const host = $('groups'); host.innerHTML = '';
    const sheet = $('sheetChk').checked, pix = $('pixChk').checked;
    document.body.classList.toggle('sheetmode', sheet);
    const placed = new Set();
    const sections = GROUPS.map(g => [g[0], g[1].filter(n => Icons.has(n))]);
    const rest = names.filter(n => !REQUIRED.includes(n));
    if (rest.length) sections.push(['Extras', rest]);
    sections.forEach(sec => {
      if (!sec[1].length) return;
      const h = document.createElement('h2'); h.className = 'grp'; h.innerHTML = sec[0] + '<small>' + sec[1].length + '</small>';
      const grid = document.createElement('div'); grid.className = 'grid';
      sec[1].forEach(n => {
        placed.add(n);
        const c = document.createElement('div'); c.className = 'panel tight card'; c.dataset.name = n;
        const row = document.createElement('div'); row.className = 'sz';
        if (!sheet) {
          row.appendChild(pix ? pixCell(n, 16, 4, 's16', '#ece6d3') : sizeCell(n, 16, 's16'));
          row.appendChild(pix ? pixCell(n, 24, 3, 's24', '#d6b36a') : sizeCell(n, 24, 's24'));
        }
        if (sheet && pix) {                                     // pixel sheet: only the 1x rasters, magnified
          row.appendChild(pixCell(n, 16, 3, 's16', '#ece6d3')); row.appendChild(pixCell(n, 24, 2, 's24', '#d6b36a'));
        } else {
          const z = document.createElement('span'); z.className = 'z sbig' + ($('gridChk').checked ? ' g' : '');
          z.style.width = zoom + 'px'; z.style.height = zoom + 'px'; z.innerHTML = Icons.svg(n, { size: zoom });
          row.appendChild(z);
        }
        const lab = document.createElement('div'); lab.className = 'nm'; lab.innerHTML = n + '<i data-ink></i>';
        c.appendChild(row); c.appendChild(lab); grid.appendChild(c);
        cards[n] = c;
      });
      host.appendChild(h); host.appendChild(grid);
    });
    document.documentElement.style.setProperty('--cw', (sheet && pix ? 128 : sheet ? zoom + 22 : zoom + (pix ? 150 : 118)) + 'px');
    document.documentElement.style.setProperty('--rowh', (sheet && pix ? 48 : sheet ? zoom : Math.max(zoom, pix ? 72 : 0)) + 'px');
    paintInk(); filter();
  }
  function filter() {
    const toks = $('q').value.trim().toLowerCase().split(/[\s,]+/).filter(Boolean);     // several words/commas = show any of them
    let shown = 0;
    document.querySelectorAll('.card').forEach(c => { const ok = !toks.length || toks.some(t => c.dataset.name.indexOf(t) >= 0); c.style.display = ok ? '' : 'none'; if (ok) shown++; });
    document.querySelectorAll('h2.grp').forEach(h => { const g = h.nextElementSibling; h.style.display = g.querySelector('.card:not([style*="none"])') ? '' : 'none'; g.style.display = h.style.display; });
    $('count').textContent = shown + ' / ' + names.length + ' icons';
  }

  // ---- ink measurement (visual-weight consistency) -----------------------------------------------
  const ink = {};
  function measure(name) {
    return new Promise(res => {
      const S = 96, img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas'); cv.width = cv.height = S;
        const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, S, S);
        const d = cx.getImageData(0, 0, S, S).data;
        let sum = 0, x0 = S, y0 = S, x1 = -1, y1 = -1;
        for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
          const a = d[(y * S + x) * 4 + 3];
          if (a > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
          sum += a / 255;
        }
        const k = 24 / S;
        res({ ink: sum / (S * S), x0: x0 * k, y0: y0 * k, x1: (x1 + 1) * k, y1: (y1 + 1) * k });
      };
      img.onerror = () => res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(Icons.svg(name).replace(/currentColor/g, '#fff'));
    });
  }
  async function measureAll() {
    for (const n of names) { ink[n] = await measure(n); }
    paintInk();
    const vals = names.map(n => ink[n] && ink[n].ink).filter(v => v != null).sort((a, b) => a - b);
    const med = vals[vals.length >> 1];
    const out = names.filter(n => ink[n] && (ink[n].ink < med * 0.62 || ink[n].ink > med * 1.55));
    const edge = names.filter(n => ink[n] && (ink[n].x0 < 0.9 || ink[n].y0 < 0.9 || ink[n].x1 > 23.1 || ink[n].y1 > 23.1));
    window.__inkReport = { median: med, outliers: out, edge }; window.__ink = ink;
    summary(med, out, edge);
  }
  function paintInk() {
    document.querySelectorAll('.card').forEach(c => {
      const i = c.querySelector('[data-ink]'), m = ink[c.dataset.name];
      if (!i) return;
      if (!$('inkChk').checked) { i.textContent = ''; return; }
      if (!m) { i.textContent = '…'; return; }
      const w = window.__inkReport; const bad = w && (w.outliers.indexOf(c.dataset.name) >= 0 || w.edge.indexOf(c.dataset.name) >= 0);
      i.textContent = 'ink ' + Math.round(m.ink * 100) + '%  ' + m.x0.toFixed(1) + '–' + m.x1.toFixed(1) + ' × ' + m.y0.toFixed(1) + '–' + m.y1.toFixed(1);
      i.className = bad ? 'warn' : '';
    });
  }

  function summary(med, out, edge) {
    const st = $('status');
    const bad = problems.length > 0;
    const lines = [];
    lines.push(REQUIRED.length + ' required names · ' + names.length + ' icons · median ink ' + Math.round(med * 100) + '%');
    if (out.length) lines.push('weight outliers (orange): ' + out.join(', '));
    if (edge.length) lines.push('ink within 0.9u of the edge: ' + edge.join(', '));
    st.className = 'status' + (bad ? ' bad' : '');
    st.innerHTML = (bad ? 'Self-test FAILED' : 'Self-test OK') + ' — ' + lines.map(l => l.replace(/</g, '&lt;')).join(' · ')
      + (bad ? '<ul>' + problems.map(p => '<li>' + p.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</li>').join('') + '</ul>' : '');
  }

  // ---- in-context strip (how the kit uses it: .ico class, em sizing, semantic colours) -------------
  function ico(n, cls) { return Icons.svg(n, { cls: 'ico' + (cls ? ' ' + cls : '') }); }
  function ctx() {
    const items = [['money', 't-gold', '1,284 BC'], ['industry', 't-ember', '294'], ['food', 't-leaf', '+56'], ['research', 't-cyan', '120 RP'],
      ['ecology', 't-teal', '12'], ['defense', 't-azure', '8'], ['ship', 't-azure', '14'], ['war', 't-rose', 'War'], ['diplomacy', 't-violet', 'Peace'], ['pop', 't-ivory', '100']];
    let h = items.map(i => '<span class="' + i[1] + '" style="display:inline-flex;align-items:center;gap:.35em">' + ico(i[0]) + '<span class="t-ivory num">' + i[2] + '</span></span>').join('');
    h += '<button class="btn" type="button">' + ico('design') + 'Design</button>';
    h += '<button class="btn primary" type="button">' + ico('nextturn') + 'Next turn</button>';
    h += '<button class="btn small" type="button">' + ico('save') + 'Save</button>';
    h += '<button class="btn small danger" type="button">' + ico('cancel') + 'Scrap</button>';
    h += '<span class="chip ok">' + ico('ok') + 'Peace</span><span class="chip bad">' + ico('skull') + 'Lost</span><span class="chip vi">' + ico('alliance') + 'Allied</span>';
    $('ctx').innerHTML = h;
  }

  // ---- wiring --------------------------------------------------------------------------------------
  const seg = $('zoomSeg');
  [48, 72, 96, 144, 192].forEach(z => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small' + (z === zoom ? ' active' : ''); b.textContent = z;
    b.onclick = () => { zoom = z; seg.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b)); build(); };
    seg.appendChild(b);
  });
  $('q').value = qs.get('q') || '';
  $('gridChk').checked = qs.get('grid') === '1';
  $('pixChk').checked = qs.get('pix') === '1';
  $('sheetChk').checked = qs.get('sheet') === '1';
  $('pixChk').addEventListener('change', build);
  $('sheetChk').addEventListener('change', build);
  $('q').addEventListener('input', filter);
  $('gridChk').addEventListener('change', () => document.querySelectorAll('.card .z').forEach(z => z.classList.toggle('g', $('gridChk').checked)));
  $('inkChk').addEventListener('change', paintInk);
  ctx(); build();
  if (problems.length) { $('status').className = 'status bad'; $('status').innerHTML = 'Self-test FAILED<ul>' + problems.map(p => '<li>' + p.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</li>').join('') + '</ul>'; }
  measureAll();
  window.addEventListener('error', e => { const li = document.createElement('div'); li.className = 'status bad'; li.textContent = 'JS error: ' + e.message; document.querySelector('.pg').insertBefore(li, $('status')); });
})();
</script>
</body>
</html>
