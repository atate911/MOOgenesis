</head>
<body>

  <div id="screens"><div class="screen active"><div class="abs-fill scroll-y" id="scroll"><div id="pg"></div></div></div></div>
  <div id="overlay"></div><div id="toasts"></div><div id="tip" role="tooltip"></div>
</div>

<script src="../js/core/util.js"></script>
<script src="../js/gfx/icons.js"></script>
