<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio engine test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/base.css">
<style>
  html { font-size: 14px; }
  body { overflow: auto; user-select: text; -webkit-user-select: text; }
  main { max-width: 1280px; margin: 0 auto; padding: 1rem 1.2rem 4rem; }
  h1 { font-size: 1.6rem; margin-bottom: .2rem; } h2 { font-size: 1.15rem; margin: 1.4rem 0 .5rem; border-bottom: 1px solid var(--brass-lo); padding-bottom: .2rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .4rem 0; }
  button { background: var(--steel); border: 1px solid var(--brass-lo); color: var(--ivory); padding: .25rem .6rem; cursor: pointer; font-size: .9rem; }
  button:hover { background: var(--steel-hi); border-color: var(--brass); }
  button.on { background: #22406b; border-color: var(--cyan); }
  label { color: var(--mist); display: inline-flex; gap: .4rem; align-items: center; }
  input[type=range] { width: 9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: .35rem; }
  .trk { display: flex; flex-direction: column; border: 1px solid var(--steel-hi); padding: .3rem .4rem; background: var(--night); }
  .trk b { color: var(--brass-hi); font-weight: 400; } .trk small { color: var(--fog); line-height: 1.15; min-height: 2.3em; }
  .trk .btns { display: flex; gap: .3rem; margin-top: .25rem; }
  table { border-collapse: collapse; width: 100%; font: 12px/1.35 ui-monospace, Consolas, monospace; margin: .4rem 0; }
  th, td { border: 1px solid var(--steel-hi); padding: 2px 6px; text-align: right; white-space: nowrap; }
  th { background: var(--deep); color: var(--brass-hi); position: sticky; top: 0; } td:first-child, th:first-child { text-align: left; }
  td.pass { color: var(--leaf); } td.fail { color: var(--rose); font-weight: 700; } td.warn { color: var(--ember); } td.note { text-align: left; color: var(--mist); white-space: normal; }
  #status { color: var(--cyan); min-height: 1.4em; font: 13px ui-monospace, Consolas, monospace; }
  #summary { font: 13px ui-monospace, Consolas, monospace; color: var(--ivory); white-space: pre-wrap; background: var(--night); border: 1px solid var(--steel-hi); padding: .5rem .7rem; }
  .scroll { max-height: 36rem; overflow: auto; border: 1px solid var(--steel); }
</style>
</head>
<body>
<main>
  <h1>Audio engine test</h1>
  <div id="status">idle — click "Init audio" first (browsers need a gesture)</div>

  <h2>Engine</h2>
  <div class="row">
    <button id="b-init">Init audio</button>
    <label>music <input id="v-music" type="range" min="0" max="1" step="0.01"> <span id="vv-music"></span></label>
    <label>sfx <input id="v-sfx" type="range" min="0" max="1" step="0.01"> <span id="vv-sfx"></span></label>
    <label><input id="v-mute" type="checkbox"> muted</label>
    <label>intensity <input id="v-int" type="range" min="0" max="1" step="0.01" value="0"> <span id="vv-int">0</span></label>
    <button id="b-stop">Stop music</button>
    <button id="b-pl">Playlist (shuffle)</button>
    <button id="b-stats">Stats</button>
    <span id="stats" style="color:var(--mist);font:12px ui-monospace,Consolas,monospace"></span>
  </div>

  <h2>Music tracks</h2>
  <div id="tracks" class="grid"></div>

  <h2>Sound effects</h2>
  <div id="sfx" class="row"></div>

  <h2>Verification</h2>
  <div class="row">
    <button id="r-music30">Music: 30 s window of every track</button>
    <button id="r-musicfull">Music: full loop of every track</button>
    <button id="r-sfx">SFX: render every effect</button>
    <button id="r-lint">Composition lint</button>
    <button id="r-leak">Node leak / crossfade test (real-time, ~25 s)</button>
    <select id="lay-track"></select><button id="r-layers">Layer balance (solo each layer, 30 s from 0:40)</button>
    <button id="r-all">Run everything</button>
  </div>
  <div id="summary">no results yet</div>
  <h2>Composition lint</h2><div class="scroll"><table id="t-lint"></table></div>
  <h2>Music render metrics</h2><div class="scroll"><table id="t-music"></table></div>
  <h2>SFX render metrics</h2><div class="scroll"><table id="t-sfx"></table></div>
  <h2>Leak test</h2><div class="scroll"><table id="t-leak"></table></div>
  <h2>Layer balance</h2><div class="scroll"><table id="t-layers"></table></div>
  <h2>Level calibration (single voices)</h2>
  <div class="row"><button id="r-cal">Calibrate instruments + drum voices</button></div>
  <div class="scroll"><table id="t-cal"></table></div>
</main>

<script src="../js/core/ns.js"></script>
<script src="../js/audio/audio.js"></script>
<script src="../js/audio/music.js"></script>
<script src="../js/audio/sfx.js"></script>
<script>
(function (M) {
  'use strict';
  const A = M.Audio, Music = A.Music, SFX = A.SFX;
  const $ = id => document.getElementById(id);
  const status = t => { $('status').textContent = t; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const yieldUI = () => new Promise(r => setTimeout(r, 0));
  const R = window.__audioTest = { music: {}, sfx: {}, lint: {}, leak: [], log: [], running: false, done: false };

  // ------------------------------------------------------------ analysis helpers
  function fftInPlace(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = a + len / 2, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
          const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
        }
      }
    }
  }
  const db = x => 20 * Math.log10(Math.max(x, 1e-9));
  const r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100, r3 = x => Math.round(x * 1000) / 1000;

  function analyze(buf, opt) {
    opt = opt || {};
    const sr = buf.sampleRate, n = buf.length, L = buf.getChannelData(0), Rr = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
    let peak = 0, sumsq = 0, nan = 0, dc = 0, clip = 0;
    for (let i = 0; i < n; i++) {
      const l = L[i], r = Rr[i];
      if (!isFinite(l) || !isFinite(r)) { nan++; continue; }
      const a = Math.max(Math.abs(l), Math.abs(r));
      if (a > peak) peak = a;
      if (a > 0.99) clip++;
      sumsq += (l * l + r * r) * 0.5; dc += (l + r) * 0.5;
    }
    const rms = Math.sqrt(sumsq / n), out = { peak: peak, rms: rms, rmsDb: db(rms), nan: nan, dc: dc / n, clip: clip, secs: n / sr };
    // 1-second windows
    const w = Math.floor(sr); let silent = 0, wins = 0, minWin = 0, maxWin = -200;
    for (let s = 0; s + w <= n; s += w) {
      let e = 0; for (let i = s; i < s + w; i++) { const m = (L[i] + Rr[i]) * 0.5; e += m * m; }
      const d = db(Math.sqrt(e / w)); wins++; if (d < -55) silent++; if (d > maxWin) maxWin = d; if (wins === 1 || d < minWin) minWin = d;
    }
    out.silentPct = wins ? 100 * silent / wins : 0; out.winMin = minWin; out.winMax = maxWin;
    // RMS over the half-second windows that actually contain sound (used to calibrate layer levels)
    { const hw = Math.floor(sr * 0.5); let pw = 0, cnt = 0;
      for (let s0 = 0; s0 + hw <= n; s0 += hw) { let e = 0; for (let i = s0; i < s0 + hw; i++) { const m = (L[i] + Rr[i]) * 0.5; e += m * m; } e /= hw; if (db(Math.sqrt(e)) > -65) { pw += e; cnt++; } }
      out.actDb = cnt ? db(Math.sqrt(pw / cnt)) : -200; }
    // spectrum: average power over frames
    const N = 4096, hop = Math.max(N, Math.floor(n / 160)), re = new Float64Array(N), im = new Float64Array(N), P = new Float64Array(N / 2), win = new Float64Array(N);
    for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
    let frames = 0;
    for (let s = 0; s + N <= n; s += hop) {
      for (let i = 0; i < N; i++) { re[i] = (L[s + i] + Rr[s + i]) * 0.5 * win[i]; im[i] = 0; }
      fftInPlace(re, im);
      for (let k = 0; k < N / 2; k++) P[k] += re[k] * re[k] + im[k] * im[k];
      frames++;
    }
    const bw = sr / N; let eLo = 0, eMid = 0, eHi = 0, tot = 0, cen = 0;
    for (let k = 1; k < N / 2; k++) {
      const f = k * bw, e = P[k]; tot += e; cen += e * f;
      if (f < 200) eLo += e; else if (f < 2000) eMid += e; else eHi += e;
    }
    out.low = tot ? 100 * eLo / tot : 0; out.mid = tot ? 100 * eMid / tot : 0; out.high = tot ? 100 * eHi / tot : 0; out.centroid = tot ? cen / tot : 0;
    // log-spaced band feature vector (for SFX distinctness)
    const edges = [60, 120, 250, 500, 1000, 2000, 4000, 8000, 16000], feat = new Float64Array(8);
    for (let k = 1; k < N / 2; k++) { const f = k * bw; for (let b = 0; b < 8; b++) if (f >= edges[b] && f < edges[b + 1]) { feat[b] += P[k]; break; } }
    let ft = 0; for (let b = 0; b < 8; b++) { feat[b] = Math.log10(feat[b] + 1e-12); ft += feat[b]; }
    out.feat = Array.from(feat);
    // head / tail / envelope shape
    let head = 0; for (let i = 0; i < Math.min(8, n); i++) head = Math.max(head, Math.abs(L[i]), Math.abs(Rr[i]));
    let tail = 0; for (let i = Math.max(0, n - 256); i < n; i++) tail = Math.max(tail, Math.abs(L[i]), Math.abs(Rr[i]));
    out.head = head; out.tail = tail;
    const eb = 16, envv = new Float64Array(eb), seg = Math.floor(n / eb);
    for (let b = 0; b < eb; b++) { let e = 0; for (let i = b * seg; i < (b + 1) * seg; i++) { const m = (L[i] + Rr[i]) * 0.5; e += m * m; } envv[b] = Math.sqrt(e / seg); }
    out.env = Array.from(envv);
    // effective length: last sample where short-window RMS > -55 dBFS (1 ms*... 20 ms windows)
    const wlen = Math.floor(sr * 0.02); let eff = 0;
    for (let s = Math.floor((n - wlen) / wlen) * wlen; s >= 0; s -= wlen) { let e = 0; for (let i = s; i < s + wlen; i++) { const m = (L[i] + Rr[i]) * 0.5; e += m * m; } if (db(Math.sqrt(e / wlen)) > -55) { eff = (s + wlen) / sr; break; } }
    out.effSecs = eff;
    // largest jump between consecutive samples (click detector) in the first 20 ms
    let jump = 0; for (let i = 1; i < Math.min(n, Math.floor(sr * 0.02)); i++) jump = Math.max(jump, Math.abs(L[i] - L[i - 1]));
    out.jump20 = jump;
    return out;
  }

  // ------------------------------------------------------------ rendering runners
  function cell(txt, cls, title) { return '<td class="' + (cls || '') + '"' + (title ? ' title="' + title + '"' : '') + '>' + txt + '</td>'; }
  function setTable(el, head, rows) { el.innerHTML = '<tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr>' + rows.join(''); }

  function sliceBuffer(buf, off) {
    const b = new AudioBuffer({ numberOfChannels: buf.numberOfChannels, length: buf.length - off, sampleRate: buf.sampleRate });
    for (let c = 0; c < buf.numberOfChannels; c++) b.copyToChannel(buf.getChannelData(c).subarray(off), c);
    b.mooStats = buf.mooStats;
    return b;
  }
  const MUSIC_LIMITS = { peak: 0.98, rmsLo: -28, rmsHi: -12, silentMax: 15, bandMin: 0.5 };
  function judgeMusic(a) {
    const f = [];
    if (a.nan) f.push('NaN'); if (a.peak > MUSIC_LIMITS.peak) f.push('peak');
    if (a.rmsDb < MUSIC_LIMITS.rmsLo || a.rmsDb > MUSIC_LIMITS.rmsHi) f.push('rms');
    if (a.silentPct >= MUSIC_LIMITS.silentMax) f.push('silence');
    if (a.vPeak > 32) f.push('polyphony'); if (a.vRefused > 0.03 * (a.vMade + a.vRefused)) f.push('voices-refused');
    if (a.low < MUSIC_LIMITS.bandMin || a.mid < MUSIC_LIMITS.bandMin || a.high < MUSIC_LIMITS.bandMin) f.push('bands');
    return f;
  }
  function renderMusicTable() {
    const rows = [];
    for (const id of Object.keys(R.music)) {
      const a = R.music[id], f = a.fails;
      rows.push('<tr>' + cell(id) + cell(a.mode) + cell(r1(a.secs)) + cell(r3(a.peak), a.peak > MUSIC_LIMITS.peak ? 'fail' : 'pass') + cell(r1(a.rmsDb), a.rmsDb < MUSIC_LIMITS.rmsLo || a.rmsDb > MUSIC_LIMITS.rmsHi ? 'fail' : 'pass')
        + cell(r1(a.silentPct) + '%', a.silentPct >= MUSIC_LIMITS.silentMax ? 'fail' : 'pass') + cell(r1(a.low) + '%', a.low < 0.5 ? 'fail' : 'pass') + cell(r1(a.mid) + '%', a.mid < 0.5 ? 'fail' : 'pass') + cell(r1(a.high) + '%', a.high < 0.5 ? 'fail' : 'pass')
        + cell(Math.round(a.centroid)) + cell(a.nan, a.nan ? 'fail' : 'pass') + cell(r1(a.winMin) + '/' + r1(a.winMax)) + cell(a.clip) + cell(a.vPeak + '/' + a.vStolen + '/' + a.vRefused, a.vRefused ? 'warn' : '') + cell(r1(a.ms) + 's') + cell(f.length ? 'FAIL: ' + f.join(',') : 'PASS', f.length ? 'fail' : 'pass') + '</tr>');
    }
    setTable($('t-music'), ['track', 'mode', 'secs', 'peak', 'RMS dBFS', 'silent 1s', '&lt;200Hz', '200-2k', '&gt;2k', 'centroid', 'NaN', 'win min/max dB', 'clip', 'voices peak/stolen/refused', 'render', 'verdict'], rows);
  }
  async function runMusic(ids, seconds, full) {
    const all = Music.list().map(t => t.id); ids = ids || all;
    for (const id of ids) {
      status('rendering ' + id + (full ? ' (full loop)' : ' (' + seconds + ' s)') + ' …');
      const info = Music.list().find(t => t.id === id), t0 = performance.now();
      let secs = seconds, from = 0, pre = 0;
      if (full) { secs = (info.introSeconds || 0) + info.seconds; } else { from = info.introSeconds || 0; pre = Math.min(12, from); }   // window = start of the looping body, with a pre-roll so held notes are already sounding
      try {
        let buf = await Music.renderOffline(id, secs + pre, { from: from - pre });
        if (pre) buf = sliceBuffer(buf, Math.round(pre * buf.sampleRate));
        const a = analyze(buf); a.ms = (performance.now() - t0) / 1000; a.mode = full ? 'full loop' : 'win @' + Math.round(from) + 's';
        const st = buf.mooStats || {}; a.vPeak = st.peak || 0; a.vStolen = st.stolen || 0; a.vRefused = st.refused || 0; a.vMade = st.created || 0;
        a.fails = judgeMusic(a); delete a.feat; delete a.env;
        R.music[id] = a;
      } catch (e) { R.music[id] = { mode: 'ERR', secs: 0, peak: 99, rmsDb: 0, silentPct: 100, low: 0, mid: 0, high: 0, centroid: 0, nan: 1, winMin: 0, winMax: 0, clip: 0, ms: 0, fails: ['exception: ' + e.message] }; console.error(e); }
      renderMusicTable(); await yieldUI();
    }
  }

  const SFX_LIMITS = { peak: 0.98, rmsMin: -42 };
  function judgeSfx(a, id) {
    const f = [];
    if (a.nan) f.push('NaN'); if (a.peak > SFX_LIMITS.peak) f.push('peak');
    if (a.head > 0.02) f.push('click-in'); if (a.tail > 0.003) f.push('cut-tail'); if (a.peak < 0.08) f.push('quiet'); if (a.effSecs < 0.02) f.push('too-short');
    return f;
  }
  function cosine(a, b) { let d = 0, na = 0, nb = 0; for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; } return d / Math.sqrt(na * nb || 1); }
  function renderSfxTable() {
    const rows = [], ids = Object.keys(R.sfx);
    for (const id of ids) {
      const a = R.sfx[id];
      // nearest neighbour by (band spectrum + envelope) feature
      let best = null, bs = -1;
      for (const o of ids) { if (o === id) continue; const s = cosine(a.fv, R.sfx[o].fv); if (s > bs) { bs = s; best = o; } }
      a.nn = best; a.nnSim = bs;
      rows.push('<tr>' + cell(id) + cell(r2(a.effSecs) + 's') + cell(r3(a.peak), a.peak > 0.98 ? 'fail' : 'pass') + cell(r1(a.rmsDb)) + cell(Math.round(a.centroid)) + cell(r1(a.low) + '/' + r1(a.mid) + '/' + r1(a.high))
        + cell(r3(a.head), a.head > 0.02 ? 'fail' : 'pass') + cell(r3(a.tail), a.tail > 0.003 ? 'fail' : 'pass') + cell(a.nan, a.nan ? 'fail' : 'pass') + cell(best ? best + ' ' + r3(bs) : '-', bs > 0.995 ? 'warn' : '') + cell(a.fails.length ? 'FAIL: ' + a.fails.join(',') : 'PASS', a.fails.length ? 'fail' : 'pass') + '</tr>');
    }
    setTable($('t-sfx'), ['sfx', 'length', 'peak', 'RMS dBFS', 'centroid', 'low/mid/high %', 'head', 'tail', 'NaN', 'nearest (cos)', 'verdict'], rows);
  }
  async function runSfx(ids) {
    ids = ids || SFX.list().map(x => x.id || x);
    for (const id of ids) {
      status('rendering sfx ' + id + ' …');
      try {
        const buf = await SFX.render(id, {});
        const a = analyze(buf); a.fails = judgeSfx(a, id);
        a.fv = a.feat.concat(a.env.map(x => Math.log10(x + 1e-6) * 1.5)); delete a.feat; delete a.env;
        R.sfx[id] = a;
      } catch (e) { R.sfx[id] = { peak: 99, rmsDb: 0, centroid: 0, low: 0, mid: 0, high: 0, head: 0, tail: 0, nan: 1, effSecs: 0, fv: [1], fails: ['exception: ' + e.message] }; console.error(e); }
      await yieldUI();
    }
    renderSfxTable();
  }

  function runLint() {
    const rows = [];
    for (const t of Music.list()) {
      let a; try { a = Music.analyze(t.id); } catch (e) { rows.push('<tr>' + cell(t.id) + '<td class="fail note" colspan="12">ERROR ' + e.message + '</td></tr>'); continue; }
      R.lint[t.id] = a;
      const looplen = a.loopSec, okLen = t.id.indexOf('race:') === 0 ? (looplen >= 40 && looplen <= 75) : (looplen >= 120 && looplen <= 215);
      const ct = a.lead.strongCT, cf = a.lead.strongOK, okCT = cf === null || cf >= a.lintMin;
      rows.push('<tr>' + cell(t.id) + cell(a.key) + cell(a.bpm) + cell(a.meter) + cell(r1(a.introSec) + '+' + r1(a.loopSec) + 's', okLen ? 'pass' : 'fail') + cell(a.secs.length) + cell(a.lead.notes)
        + cell(ct === null ? '-' : Math.round(ct * 100) + '% / ' + Math.round(cf * 100) + '%', okCT ? 'pass' : 'fail') + cell(a.lead.maxLeap) + cell(a.eventsPerSec) + cell(a.deterministic ? 'yes' : 'NO', a.deterministic ? 'pass' : 'fail') + cell(Math.round(a.variation * 100) + '%')
        + '<td class="note ' + (a.warnings.length ? 'fail' : '') + '">' + (a.warnings.length ? a.warnings.join('; ') : 'ok') + '</td></tr>');
    }
    setTable($('t-lint'), ['track', 'key', 'bpm', 'meter', 'intro+loop', 'sections', 'lead notes', 'strong beats: chord tones / clash-free', 'max leap', 'events/s', 'deterministic', 'pass-to-pass change', 'warnings'], rows);
  }

  // ------------------------------------------------------------ real-time leak / crossfade test
  async function runLeak() {
    const rows = [], log = (name, val, ok, note) => { R.leak.push({ name, val, ok, note }); rows.push('<tr>' + cell(name) + cell(val) + cell(ok ? 'PASS' : 'FAIL', ok ? 'pass' : 'fail') + '<td class="note">' + (note || '') + '</td></tr>'); setTable($('t-leak'), ['check', 'value', 'verdict', 'note'], rows); };
    R.leak = [];
    A.init(); await sleep(300);
    if (!A.isReady()) { log('audio context running', A.ctx ? A.ctx.state : 'none', false, 'click "Init audio" first (needs a user gesture)'); return; }
    Music.stop({ fade: 0.05 }); await sleep(800);
    const base = A.stats();
    log('baseline nodes', base.nodes + ' (voices ' + base.voices + ')', base.voices === 0);
    Music.setIntensity(0.9);
    status('leak test: playing combat1 …'); Music.play('combat1', { fade: 0.2 }); await sleep(4500);
    const s1 = A.stats(), st1 = Music.state();
    log('while playing combat1', 'voices ' + s1.voices + ' nodes ' + s1.nodes + ' stolen ' + s1.stolen + ' refused ' + s1.refused, s1.voices > 0 && s1.voices <= s1.maxVoices + 4, 'polyphony cap ' + s1.maxVoices);
    status('leak test: crossfading to galaxy1 …'); Music.play('galaxy1', { fade: 1.5 }); await sleep(900);
    const sx = Music.state(); log('during crossfade', 'players: cur ' + sx.cur + ' + ' + sx.old + ' fading', sx.old === 1 && sx.cur === 'galaxy1');
    await sleep(3500);
    const s2 = Music.state(); log('after crossfade', 'cur ' + s2.cur + ', fading ' + s2.old, s2.old === 0 && s2.cur === 'galaxy1', 'old player disposed');
    status('leak test: stopping …'); Music.stop({ fade: 0.4 }); await sleep(900);
    const s3 = Music.state(); log('after stop: timer', s3.timer ? 'running' : 'cleared', !s3.timer && !s3.cur && s3.old === 0);
    await sleep(6500);
    const e = A.stats(); log('after stop: live voices', e.voices, e.voices === 0);
    log('after stop: node count', e.nodes + ' vs baseline ' + base.nodes, e.nodes === base.nodes, 'every voice + player bus freed');
    // playlist: two tiny hidden tracks must hand over to each other (gap + crossfade) and free everything afterwards
    const mini = (n, root) => Music._define(n, { hidden: true, desc: 'test', bpm: 240, root: root, mode: 'major', tens: false, ph: { A: '1:1 3:1 5:1 8:1' }, sec: [{ n: 'S', bars: 4, prog: 'I', pad: 'sus', bass: 'whole', lead: 'A A A A' }] });
    mini('test:a', 'C'); mini('test:b', 'G');
    status('leak test: playlist …'); Music.playlist(['test:a', 'test:b'], { gap: 0.4, fade: 1, firstFade: 0.1 });
    const seen = []; let maxOld = 0;
    for (let i = 0; i < 40; i++) { await sleep(400); const st = Music.state(); if (st.cur && seen[seen.length - 1] !== st.cur) seen.push(st.cur); if (st.old > maxOld) maxOld = st.old; }
    log('playlist hand-over', seen.join(' > '), seen.length >= 3 && seen.indexOf('test:b') >= 0, 'tracks alternate automatically, at most ' + maxOld + ' fading player(s) at once');
    Music.stop({ fade: 0.2 }); await sleep(7000);
    const pe = A.stats(); log('after playlist: voices / nodes', pe.voices + ' / ' + pe.nodes + ' (base ' + base.nodes + ')', pe.voices === 0 && pe.nodes === base.nodes);
    // SFX spam
    if (SFX.list().length) { for (let i = 0; i < 80; i++) { SFX.play('click'); SFX.play('coins'); } await sleep(300); const sp = A.stats(); log('sfx spam: voices', sp.voices + ' (cap ' + sp.maxVoices + ')', sp.voices <= sp.maxVoices); await sleep(5000); const sp2 = A.stats(); log('sfx spam freed', sp2.nodes + ' vs ' + base.nodes, sp2.nodes === base.nodes); }
    Music.setIntensity(0);
    status('leak test done');
  }

  // ------------------------------------------------------------ per-layer solo balance (diagnostic)
  const LAYER_NAMES = ['pad', 'bass', 'arp', 'lead', 'bell', 'choir', 'drums', 'fx', 'x1', 'x2', 'x3'];
  async function layerReport(id, seconds, from, intensity) {
    const rows = {}, opts = { from: from || 0, intensity: intensity || 0 };
    const brief = a => ({ rmsDb: a.rmsDb, actDb: a.actDb, peak: a.peak, low: a.low, mid: a.mid, high: a.high, centroid: a.centroid });
    rows.ALL = brief(analyze(await Music.renderOffline(id, seconds, opts)));
    for (const ly of LAYER_NAMES) {
      if (ly.charAt(0) === 'x' && !intensity) continue;
      const a = analyze(await Music.renderOffline(id, seconds, Object.assign({ only: [ly] }, opts)));
      if (a.rmsDb > -90) rows[ly] = brief(a);
      await yieldUI();
    }
    const t = [];
    for (const k of Object.keys(rows)) { const a = rows[k]; t.push('<tr>' + cell(id + ' / ' + k) + cell(r1(a.rmsDb) + ' (act ' + r1(a.actDb) + ')') + cell(r3(a.peak)) + cell(r1(a.low) + '%') + cell(r1(a.mid) + '%') + cell(r1(a.high) + '%') + cell(Math.round(a.centroid)) + '</tr>'); }
    $('t-layers').insertAdjacentHTML('beforeend', t.join(''));
    return rows;
  }
  R.layerReport = layerReport;

  // ------------------------------------------------------------ voice / instrument level calibration
  const CAL_CLASS = { pad: 'pad', drone: 'pad', choir: 'choir', bass: 'bass', brass: 'lead', flute: 'lead', harp: 'lead', pluck: 'pluck', bell: 'bell', chime: 'bell' };
  const CAL_TARGET = { pad: -24, choir: -26, bass: -25, lead: -23, pluck: -24, bell: -27 };
  const CAL_REF = 0.2;
  function calPassage(eng, name, inst, cls) {
    const V = A.Voices[inst.v], dest = eng.musicBus, vel = CAL_REF * (inst.lvl === undefined ? 1 : inst.lvl), t0 = 0.1;
    const play = (t, midi, dur) => V(eng, dest, t, Object.assign({}, inst, { f: 440 * Math.pow(2, (midi - 69) / 12), dur: dur, vel: vel }));
    if (cls === 'pad' || cls === 'choir') { const ch = [[57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67], [57, 60, 64, 69]]; ch.forEach((c, k) => c.forEach(m => play(t0 + k * 2.4, m + (cls === 'pad' && inst.v === 'drone' ? -19 : 0), 2.2))); return 10.5; }
    if (cls === 'bass') { [38, 38, 45, 38, 43, 38, 45, 50].forEach((m, k) => play(t0 + k * 0.5, m, 0.42)); return 4.6; }
    if (cls === 'lead') { [64, 67, 69, 72, 71, 69, 67, 65, 64, 60].forEach((m, k) => play(t0 + k * 0.55, m, 0.5)); return 6.2; }
    if (cls === 'pluck') { for (let k = 0; k < 16; k++) play(t0 + k * 0.2, [60, 64, 67, 72, 76, 72, 67, 64][k % 8], 0.18); return 4.0; }
    if (cls === 'bell') { [72, 76, 79, 84, 79, 76, 81, 72].forEach((m, k) => play(t0 + k * 0.6, m, inst.dur || 0.5)); return 8; }
    return 1;
  }
  async function calibrate() {
    const rows = [], out = { inst: {}, drums: {} };
    const INST = Music._INST;
    for (const name of Object.keys(INST)) {
      const inst = INST[name], cls = CAL_CLASS[inst.v]; if (!cls) continue;
      let secs = 1;
      const buf = await A.offline(12, eng => { secs = calPassage(eng, name, inst, cls); });
      const a = analyze(buf), est = a.actDb + 20 * Math.log10(1 / CAL_REF), lvl = Math.pow(10, (CAL_TARGET[cls] - est) / 20);   // correction factor on top of the preset's current lvl
      out.inst[name] = { cls: cls, act: a.actDb, est: est, peakAtRef: a.peak, lvl: lvl };
      rows.push('<tr>' + cell('inst ' + name) + cell(cls) + cell(r1(a.actDb)) + cell(r1(est)) + cell(r3(a.peak)) + cell(CAL_TARGET[cls]) + cell(r2(lvl), Math.abs(Math.log10(lvl)) > 0.15 ? 'warn' : 'pass') + '</tr>');
      await yieldUI();
    }
    const DRUM_TARGET = { kick: 0.65, snare: 0.5, hat: 0.22, tom: 0.5, timp: 0.6, clap: 0.4, metal: 0.25, click: 0.2, shaker: 0.15, crash: 0.3, boom: 0.7, swell: 0.25, whisper: 0.12 };
    const DRUM_ARGS = { kick: {}, snare: {}, hat: {}, tom: { f: 110 }, timp: { f: 65 }, clap: {}, metal: { f: 340 }, click: {}, shaker: {}, crash: {}, boom: {}, swell: { dur: 1.5 }, whisper: {} };
    for (const name of Object.keys(DRUM_TARGET)) {
      const buf = await A.offline(4.5, eng => { A.Voices[name](eng, eng.musicBus, 0.1, Object.assign({ vel: 0.5 }, DRUM_ARGS[name])); });
      const a = analyze(buf), pk1 = a.peak * 2;
      out.drums[name] = { peakAtVel1: pk1, factor: DRUM_TARGET[name] / pk1 };
      rows.push('<tr>' + cell('drum ' + name) + cell('hit') + cell(r1(a.rmsDb)) + cell('-') + cell(r3(a.peak) + ' (x2 = ' + r3(pk1) + ')') + cell(DRUM_TARGET[name]) + cell(r2(DRUM_TARGET[name] / pk1), Math.abs(Math.log10(DRUM_TARGET[name] / pk1)) > 0.15 ? 'warn' : 'pass') + '</tr>');
      await yieldUI();
    }
    setTable($('t-cal'), ['voice', 'class', 'active RMS @vel0.2', 'est RMS @vel1', 'peak', 'target', 'lvl factor'], rows);
    R.cal = out;
    return out;
  }
  R.calibrate = calibrate;

  // ------------------------------------------------------------ summary
  function summarize() {
    const lines = [];
    const mids = Object.keys(R.music), mf = mids.filter(i => R.music[i].fails.length);
    lines.push('music renders: ' + mids.length + ' tracks, ' + (mids.length - mf.length) + ' pass, ' + mf.length + ' fail' + (mf.length ? '  [' + mf.map(i => i + ':' + R.music[i].fails.join('+')).join(' ') + ']' : ''));
    if (mids.length) { const rm = mids.map(i => R.music[i].rmsDb); lines.push('  RMS dBFS min ' + r1(Math.min.apply(null, rm)) + ' max ' + r1(Math.max.apply(null, rm)) + ' | peak max ' + r3(Math.max.apply(null, mids.map(i => R.music[i].peak))) + ' | worst silence ' + r1(Math.max.apply(null, mids.map(i => R.music[i].silentPct))) + '%'); }
    const sids = Object.keys(R.sfx), sf = sids.filter(i => R.sfx[i].fails.length);
    lines.push('sfx renders: ' + sids.length + ' effects, ' + (sids.length - sf.length) + ' pass, ' + sf.length + ' fail' + (sf.length ? '  [' + sf.map(i => i + ':' + R.sfx[i].fails.join('+')).join(' ') + ']' : ''));
    const sim = sids.filter(i => R.sfx[i].nnSim > 0.995).map(i => i + '~' + R.sfx[i].nn);
    if (sids.length) lines.push('  similar pairs (cos>0.995): ' + (sim.length ? sim.join(' ') : 'none'));
    const lids = Object.keys(R.lint), lw = lids.filter(i => R.lint[i].warnings.length || !R.lint[i].deterministic || (R.lint[i].lead.strongOK !== null && R.lint[i].lead.strongOK < R.lint[i].lintMin));
    lines.push('lint: ' + lids.length + ' tracks, ' + lw.length + ' with warnings');
    if (R.leak.length) { const lf = R.leak.filter(x => !x.ok); lines.push('leak test: ' + R.leak.length + ' checks, ' + lf.length + ' fail' + (lf.length ? ' [' + lf.map(x => x.name).join(', ') + ']' : '')); }
    $('summary').textContent = lines.join('\n');
    R.summary = lines;
    return lines;
  }
  R.summarize = summarize;

  async function runAll(opts) {
    opts = opts || {};
    R.running = true; R.done = false;
    try {
      runLint();
      await runMusic(null, 30, false);
      if (opts.full) await runMusic(null, 0, true);
      await runSfx();
      summarize();
    } finally { R.running = false; R.done = true; status('verification finished'); }
  }
  R.runAll = runAll; R.runMusic = runMusic; R.runSfx = runSfx; R.runLint = runLint; R.runLeak = runLeak; R.analyze = analyze;

  // ------------------------------------------------------------ UI
  function build() {
    const tr = $('tracks');
    for (const t of Music.list()) {
      const d = document.createElement('div'); d.className = 'trk';
      d.innerHTML = '<b>' + t.id + '</b><small>' + t.desc + '</small><small>' + t.bpm + ' bpm · ' + t.seconds + ' s loop</small><div class="btns"></div>';
      const bt = d.querySelector('.btns');
      const play = document.createElement('button'); play.textContent = 'play'; play.onclick = () => { A.init(); Music.play(t.id, { fade: 1.5 }); status('playing ' + t.id); refresh(); };
      const stop = document.createElement('button'); stop.textContent = 'stop'; stop.onclick = () => { Music.stop({ fade: 1 }); refresh(); };
      bt.appendChild(play); bt.appendChild(stop); tr.appendChild(d);
    }
    $('r-cal').onclick = async () => { status('calibrating …'); await calibrate(); status('calibration done'); };
    const lt = $('lay-track');
    for (const t of Music.list()) { const op = document.createElement('option'); op.value = t.id; op.textContent = t.id; lt.appendChild(op); }
    $('r-layers').onclick = async () => { setTable($('t-layers'), ['track / layer', 'RMS dBFS', 'peak', '&lt;200Hz', '200-2k', '&gt;2k', 'centroid'], []); status('layer balance …'); await layerReport(lt.value, 30, 40); status('layer balance done'); };
    const sx = $('sfx');
    for (const e of SFX.list()) {
      const id = e.id || e, b = document.createElement('button'); b.textContent = id; b.onclick = () => { A.init(); SFX.play(id); };
      sx.appendChild(b);
    }
    const sets = A.settings;
    $('v-music').value = sets.music; $('v-sfx').value = sets.sfx; $('v-mute').checked = sets.muted;
    const upd = () => { $('vv-music').textContent = sets.music.toFixed(2); $('vv-sfx').textContent = sets.sfx.toFixed(2); };
    upd();
    $('v-music').oninput = e => { A.setVolume('music', +e.target.value); upd(); };
    $('v-sfx').oninput = e => { A.setVolume('sfx', +e.target.value); upd(); };
    $('v-mute').onchange = e => A.setMuted(e.target.checked);
    $('v-int').oninput = e => { Music.setIntensity(+e.target.value); $('vv-int').textContent = (+e.target.value).toFixed(2); };
    $('b-init').onclick = () => { A.init(); status('audio ' + (A.ctx ? A.ctx.state : 'unavailable')); };
    $('b-stop').onclick = () => Music.stop({ fade: 1 });
    $('b-pl').onclick = () => { A.init(); Music.playlist(Music.list().map(t => t.id), { shuffle: true, gap: 1.5, fade: 3 }); };
    $('b-stats').onclick = refresh;
    $('r-music30').onclick = async () => { await runMusic(null, 30, false); summarize(); };
    $('r-musicfull').onclick = async () => { await runMusic(null, 0, true); summarize(); };
    $('r-sfx').onclick = async () => { await runSfx(); summarize(); };
    $('r-lint').onclick = () => { runLint(); summarize(); };
    $('r-leak').onclick = async () => { await runLeak(); summarize(); };
    $('r-all').onclick = async () => { await runAll({ full: false }); await runLeak(); summarize(); };
    // any click unlocks audio (autoplay policy)
    document.addEventListener('pointerdown', () => A.init(), { once: true });
  }
  function refresh() { const s = A.stats(), m = Music.state(); $('stats').textContent = s ? ' ctx ' + s.state + ' · voices ' + s.voices + ' · nodes ' + s.nodes + ' (base ' + s.baseNodes + ') · music: ' + (m.cur || '-') + (m.old ? ' +' + m.old + ' fading' : '') : ' audio not initialised'; }
  build();
  setInterval(refresh, 1000);
  console.log('test-audio ready:', Music.list().length, 'tracks,', SFX.list().length, 'sfx');
})(window.MOO);
</script>
</body>
</html>
