<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diplomacy UI test — Races · Report · Status · Audience</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<!--
  Boots the real game (like index.html) with diplomacy fixtures, because the dev URL alone gives no contacts / treaties / spies.
    tools/test-diplomacy.html?screen=races&race=psilon&opp=4&turns=20&seed=abc
  Extra query flags:   fx=0  no fixtures (use the contacts the game itself produced)     fx=raw  keep contacts but do not touch treaties / attitudes
                       a1,a2,a3 attitude of empires 1..3 · t1,t2,t3 treaty (0 none 1 NAP 2 alliance 3 war) · tr1 trade BC
  Fixtures go through the real Diplo engine (Diplo.rec / setRel / setTreaty / setTrade); the spy side is seeded directly on the human empire.
-->
<style>html,body{background:#060919}</style>
</head>
<body>
<div id="app">
  <div id="screens"></div>
  <div id="overlay"></div>
  <div id="toasts"></div>
  <div id="tip" role="tooltip"></div>
  <div id="boot">
    <div class="boot-mark">Master of Orion</div>
    <div class="boot-sub">Diplomacy UI test…</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <pre id="boot-err"></pre>
  </div>
</div>
<script src="js/manifest.js"></script>
<script>
(function () {
  'use strict';
  const man = window.MOO_MANIFEST, bust = '?_=' + Date.now(), q = new URLSearchParams(location.search);
  const errors = []; window.MOO_LOAD_ERRORS = errors;
  man.css.forEach(href => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href + bust; document.head.appendChild(l); });
  const fill = document.getElementById('boot-fill');
  const load = src => new Promise(res => {
    const s = document.createElement('script'); s.src = src + bust; s.async = false;
    s.onload = res; s.onerror = () => { errors.push('js: ' + src); res(); };
    document.head.appendChild(s);
  });
  (async function () {
    const list = man.js.slice(), mainIdx = list.indexOf('js/main.js');
    const before = list.slice(0, mainIdx);
    for (let i = 0; i < before.length; i++) { await load(before[i]); fill.style.width = Math.round((i + 1) / list.length * 100) + '%'; }
    try { installFixtures(window.MOO); } catch (e) { console.error('[fixtures]', e); errors.push('fixtures: ' + e.message); }
    await load('js/main.js');
    document.getElementById('boot-err').textContent = errors.length ? 'Missing / failed:\n' + errors.join('\n') : '';
    window.MOO.boot();
  })();

  // ------------------------------------------------------------------------------------------------------------------------------------------
  function installFixtures(M) {
    if (q.get('fx') === '0') return;
    const G = M.Game, devBoot = G.devBoot;
    G.devBoot = function (qq) {
      devBoot.call(G, qq);
      const S = G.S; if (!S) return;
      const me = S.empires[0], D = M.Sim.Diplo, rel = (j, o) => Object.assign(me.relations[j], o);
      const fx = (j, o) => {                                         // o: {contact, att, treaty, trade}
        if (D && D.rec) {
          D.rec(S, 0, j).contact = D.rec(S, j, 0).contact = !!o.contact; if (o.contact) { D.rec(S, 0, j).met = Math.max(D.rec(S, 0, j).met, 2); D.rec(S, j, 0).met = 2; }
          if (o.att !== undefined) D.setRel(S, 0, j, o.att);
          if (o.treaty !== undefined) D.setTreaty(S, 0, j, o.treaty);
          if (o.trade !== undefined) D.setTrade(S, 0, j, o.trade);
        } else rel(j, { contact: !!o.contact, attitude: o.att || 0, treaty: o.treaty || 0, trade: o.trade || 0 });
      };
      if (q.get('fx') !== 'raw') {
        if (S.empires[1]) fx(1, { contact: true, att: +(q.get('a1') || 30), treaty: +(q.get('t1') || 1), trade: +(q.get('tr1') || 150) });
        if (S.empires[2]) fx(2, { contact: true, att: +(q.get('a2') || -48), treaty: +(q.get('t2') || 3), trade: 0 });
        if (S.empires[3]) fx(3, { contact: true, att: +(q.get('a3') || 0), treaty: +(q.get('t3') || 0), trade: 0 });
      }
      for (const j of [1, 2, 3]) if (S.empires[j]) { me.spies[j] = j === 1 ? 3 : j === 2 ? 1 : 0; me.spyBudget[j] = j === 1 ? 20 : j === 2 ? 8 : 0; me.spyMode[j] = j === 1 ? 1 : j === 2 ? 2 : 0; }
      me.security = 40;
      me.spyReport = me.spyReport || [];
      if (S.empires[1]) me.spyReport[1] = { year: S.year - 3, best: S.empires[1].research.completed.map(l => Math.max.apply(null, l)) };
      me.bc = Math.max(me.bc, 600);
    };
  }
})();
</script>
</body>
</html>
