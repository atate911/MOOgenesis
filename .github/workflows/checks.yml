name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax of every manifest file
        run: node tools/check.js
      - name: Rules tests
        run: node tools/rules-test.js
      - name: VERSION file matches js/core/ns.js
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          grep -Fq "M.VERSION = '$v';" js/core/ns.js || { echo "js/core/ns.js M.VERSION is not '$v' (VERSION file)"; exit 1; }
      - name: Shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh
